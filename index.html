<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mob4g Catalog</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#082d4f;--b:#1178c9;--bg:#f4f7fa;--line:#e4ebf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,sans-serif;color:#173047}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}.wrap{width:min(1180px,92%);margin:auto}.nav{display:flex;gap:12px;align-items:center;padding:12px 0;flex-wrap:wrap}.logo{font-weight:800;font-size:24px;color:var(--n);cursor:pointer;margin-left:auto}.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}.tabs{display:flex;gap:8px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#eef5fa;color:var(--n);cursor:pointer;font-weight:700}.tabs button.active,.btn.primary{background:var(--n);color:white}.hero{background:linear-gradient(135deg,#062744,#0d5e97);color:#fff;padding:40px 0}.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,50px)}.hero p{margin:0;color:#dbeaf5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.section{padding:28px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0a36540d;overflow:hidden}.phone{padding:14px;cursor:pointer}.img{height:210px;display:grid;place-items:center;background:#f7fafc;border-radius:12px}.img img{max-width:90%;max-height:190px;object-fit:contain}.phone h3{font-size:17px;margin:12px 0 4px}.muted{color:#708090;font-size:13px}.price{font-weight:800;color:var(--n);font-size:18px}.detail{display:grid;grid-template-columns:340px 1fr;gap:18px}.detail .img{height:420px}.tablewrap{overflow:auto}.spec{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.spec th,.spec td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}.spec th{background:#f7fafc;width:25%}.status{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:15px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:70px;height:70px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}.pager{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:#708090;background:#fff;border:1px dashed #cdd9e1;border-radius:14px}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail .img{height:300px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap nav"><div class="logo" onclick="home()">Mob4g</div><input id="q" class="search" placeholder="ابحث عن هاتف..."><div class="tabs"><button id="tHome" class="active" onclick="home()">الرئيسية</button><button id="tCatalog" onclick="catalog()">الكتالوج</button><button id="tCompare" onclick="comparePage()">مقارنة</button></div></div></header><main><section class="hero"><div class="wrap"><h1>كتالوج Mob4g — إصدار 2022 فما فوق</h1><p>فهرسة تدريجية من صفحات الكتالوج، ثم جلب المواصفات الكاملة عند الطلب.</p><div class="actions"><button class="btn" onclick="startSync()">ابدأ الفهرسة</button><button class="btn" onclick="nextBatch()">الدفعة التالية</button><button class="btn" onclick="loadSpecsBatch()">جلب المواصفات للدفعة</button></div></div></section><div class="wrap section"><div id="status" class="status">لم تبدأ المزامنة بعد.</div><div id="app"></div></div></main><script>const S={pages:JSON.parse(localStorage.getItem('m4_pages')||'[]'),items:JSON.parse(localStorage.getItem('m4_items')||'[]'),page:Number(localStorage.getItem('m4_page')||0),spec:JSON.parse(localStorage.getItem('m4_spec')||'{}'),compare:JSON.parse(localStorage.getItem('m4_compare')||'[]')};const save=()=>{localStorage.setItem('m4_pages',JSON.stringify(S.pages));localStorage.setItem('m4_items',JSON.stringify(S.items));localStorage.setItem('m4_page',S.page);localStorage.setItem('m4_spec',JSON.stringify(S.spec));localStorage.setItem('m4_compare',JSON.stringify(S.compare))};const status=t=>document.getElementById('status').textContent=t;const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));function setTab(id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(document.getElementById(id))document.getElementById(id).classList.add('active')}function home(){setTab('tHome');document.getElementById('app').innerHTML=`<div class="status"><b>الحالة:</b> ${S.items.length} هاتفًا مكتشفًا، آخر صفحة مفهرسة: ${S.page||0}/205.</div><div class="tools"><button class="btn primary" onclick="catalog()">عرض الكتالوج</button><button class="btn" onclick="clearAll()">مسح المزامنة</button></div>`}async function fetchJSON(u){const r=await fetch(u);const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||`HTTP ${r.status}`);return j}async function startSync(){S.page=0;S.pages=[];S.items=[];save();await nextBatch()}async function nextBatch(){const start=Math.max(1,S.page+1),end=Math.min(205,start+4);status(`جارٍ فهرسة الصفحات ${start}–${end}...`);for(let p=start;p<=end;p++){try{const j=await fetchJSON('/api/catalog?page='+p);S.pages.push(p);for(const x of j.items||[])if(x.releaseYear>=2022||!x.releaseYear){const old=S.items.findIndex(a=>a.url===x.url);old>=0?S.items[old]=x:S.items.push(x)}}catch(e){status(`فشلت الصفحة ${p}: ${e.message}`)}}S.page=end;save();status(`اكتملت الدفعة. ${S.items.length} جهازًا محفوظًا، حتى الصفحة ${end}/205.`);catalog()}function card(x){const d=S.spec[x.url]||{};return `<article class="card phone" onclick="openDevice('${encodeURIComponent(x.url)}')"><div class="img"><img loading="lazy" src="${esc(d.images?.[0]||x.image||'')}" onerror="this.style.display='none'"></div><h3>${esc(d.title||x.name||'هاتف')}</h3><div class="muted">${esc(x.releaseYear>=2022?('من '+x.releaseYear):'قيد التحقق')}</div><div class="price">${x.price?'$'+x.price:'السعر غير متوفر'}</div><button class="btn" style="width:100%;margin-top:8px" onclick="event.stopPropagation();toggleCompare('${encodeURIComponent(x.url)}')">${S.compare.includes(x.url)?'إزالة من المقارنة':'إضافة للمقارنة'}</button></article>`}function catalog(){setTab('tCatalog');const q=document.getElementById('q').value.trim().toLowerCase();const arr=S.items.filter(x=>!q||String(x.name).toLowerCase().includes(q)||String(x.url).toLowerCase().includes(q));document.getElementById('app').innerHTML=`<div class="tools"><button class="btn primary" onclick="loadSpecsBatch()">جلب مواصفات الدفعة</button><button class="btn" onclick="comparePage()">المقارنة (${S.compare.length}/3)</button></div><div class="grid">${arr.map(card).join('')}</div>${arr.length?'':'<div class="empty">لا توجد نتائج.</div>'}`}async function loadSpecsBatch(){const pending=S.items.filter(x=>x.releaseYear>=2022&&!S.spec[x.url]).slice(0,8);if(!pending.length){status('لا توجد أجهزة معلقة في الدفعة الحالية.');catalog();return}let ok=0;for(const x of pending){try{status(`جلب المواصفات: ${x.name}`);S.spec[x.url]=await fetchJSON('/api/device?url='+encodeURIComponent(x.url));ok++}catch(e){console.warn(e)}}save();status(`اكتملت دفعة المواصفات: ${ok}/${pending.length}`);catalog()}async function openDevice(enc){const url=decodeURIComponent(enc);let d=S.spec[url];if(!d){status('جارٍ جلب المواصفات...');try{d=await fetchJSON('/api/device?url='+encodeURIComponent(url));S.spec[url]=d;save()}catch(e){status(e.message);return}}setTab(null);document.getElementById('app').innerHTML=`<button class="btn" onclick="catalog()">← العودة</button><div class="detail" style="margin-top:15px"><div><div class="card img"><img src="${esc(d.images?.[0]||'')}" onerror="this.style.display='none'"></div><div class="thumbs">${(d.images||[]).map(i=>`<img loading="lazy" src="${esc(i)}">`).join('')}</div></div><div><h1>${esc(d.title)}</h1><div class="muted">${esc(d.release||'')}</div><p class="price">${d.price?'$'+d.price:'السعر غير متوفر'}</p><a class="btn" style="display:inline-block" target="_blank" href="${esc(d.url)}">فتح الصفحة الأصلية</a></div></div><div class="tablewrap" style="margin-top:18px">${(d.groups||[]).map(g=>`<h2>${esc(g.title)}</h2><table class="spec"><tbody>${g.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`).join('')}</div>`}function toggleCompare(enc){const u=decodeURIComponent(enc);const i=S.compare.indexOf(u);if(i>=0)S.compare.splice(i,1);else if(S.compare.length<3)S.compare.push(u);else return alert('الحد الأقصى 3 هواتف');save();catalog()}function comparePage(){setTab('tCompare');const ds=S.compare.map(u=>S.spec[u]).filter(Boolean);if(!ds.length){document.getElementById('app').innerHTML='<div class="empty">أضف حتى 3 هواتف من الكتالوج.</div>';return}const keys=[...new Set(ds.flatMap(d=>(d.groups||[]).flatMap(g=>g.rows.map(r=>r[0]))))];document.getElementById('app').innerHTML=`<div class="tools"><button class="btn" onclick="catalog()">إضافة المزيد</button></div><div class="tablewrap"><table class="spec"><thead><tr><th>المواصفة</th>${ds.map(d=>`<th>${esc(d.title)}</th>`).join('')}</tr></thead><tbody>${keys.map(k=>`<tr><th>${esc(k)}</th>${ds.map(d=>{const row=(d.groups||[]).flatMap(g=>g.rows).find(r=>r[0]===k);return `<td>${esc(row?.[1]||'—')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}function clearAll(){if(confirm('مسح كل بيانات المزامنة؟')){localStorage.clear();location.reload()}}document.getElementById('q').addEventListener('input',catalog);home();</script></body></html>
